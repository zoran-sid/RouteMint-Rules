name: pr-check

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

env:
  MIHOMO_VERSION: v1.19.34
  SINGBOX_VERSION: "1.14.4"
  UV_CACHE_DIR: .cache/uv

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Restore upstream snapshots
        uses: actions/cache@v4
        with:
          path: .cache/upstreams
          key: upstreams-${{ github.run_id }}
          restore-keys: |
            upstreams-

      - name: Install pinned mihomo and sing-box
        run: |
          set -euo pipefail
          mkdir -p bin
          curl -fsSL -o /tmp/mihomo.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-${MIHOMO_VERSION}.gz"
          gunzip -c /tmp/mihomo.gz > bin/mihomo
          chmod +x bin/mihomo
          curl -fsSL -o /tmp/singbox.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-linux-amd64.tar.gz"
          tar -xzf /tmp/singbox.tar.gz -C /tmp
          mv "/tmp/sing-box-${SINGBOX_VERSION}-linux-amd64/sing-box" bin/sing-box
          chmod +x bin/sing-box
          bin/sing-box version

      - name: Validate YAML
        run: uv run python -m builder check

      - name: Build and validate
        run: uv run python -m builder build --mihomo-bin "$PWD/bin/mihomo" --singbox-bin "$PWD/bin/sing-box" --validate

      - name: Install pinned ucode for router adapter tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libjson-c-dev pkg-config
          mkdir -p .cache/ucode-src
          curl -fsSL "https://github.com/jow-/ucode/archive/a2c42eac6369a0bba0315007c7dc7b7130275340.tar.gz" | tar -xz --strip-components=1 -C .cache/ucode-src
          cmake -S .cache/ucode-src -B .cache/ucode-build -DFS_SUPPORT=ON \
            -DUCI_SUPPORT=OFF -DUBUS_SUPPORT=OFF -DULOOP_SUPPORT=OFF \
            -DNL80211_SUPPORT=OFF -DRTNL_SUPPORT=OFF -DRESOLV_SUPPORT=OFF \
            -DSTRUCT_SUPPORT=OFF -DMATH_SUPPORT=OFF -DSOCKET_SUPPORT=OFF \
            -DIO_SUPPORT=OFF -DZLIB_SUPPORT=OFF -DDIGEST_SUPPORT=OFF \
            -DFFI_SUPPORT=OFF -DNETADDR_SUPPORT=OFF -DSERIAL_SUPPORT=OFF \
            -DLOG_SUPPORT=OFF -DDEBUG_SUPPORT=OFF
          cmake --build .cache/ucode-build -j2 --target ucode fs_lib

      - name: Test
        env:
          ROUTEMINT_MIHOMO_BIN: ${{ github.workspace }}/bin/mihomo
          ROUTEMINT_SINGBOX_BIN: ${{ github.workspace }}/bin/sing-box
        run: uv run pytest
