name: build

on:
  schedule:
    # 19:17 UTC = 03:17 Asia/Shanghai / Asia/Hong_Kong the next day.
    - cron: "17 19 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sources/**"
      - "presets/**"
      - "templates/**"
      - "builder/**"
      - "tests/**"
      - "upstreams.yaml"
      - "budgets.yaml"
      - "uv.lock"
      - "pyproject.toml"
      - "repo.yaml"
      - "README.md"
      - "docs/qr/**"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  MIHOMO_VERSION: v1.19.34
  SINGBOX_VERSION: "1.14.4"
  UV_CACHE_DIR: .cache/uv

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Restore upstream snapshots
        uses: actions/cache@v4
        with:
          path: .cache/upstreams
          key: upstreams-${{ github.run_id }}
          restore-keys: |
            upstreams-

      - name: Install pinned mihomo and sing-box
        run: |
          set -euo pipefail
          mkdir -p bin
          curl -fsSL -o /tmp/mihomo.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-${MIHOMO_VERSION}.gz"
          gunzip -c /tmp/mihomo.gz > bin/mihomo
          chmod +x bin/mihomo
          curl -fsSL -o /tmp/singbox.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-linux-amd64.tar.gz"
          tar -xzf /tmp/singbox.tar.gz -C /tmp
          mv "/tmp/sing-box-${SINGBOX_VERSION}-linux-amd64/sing-box" bin/sing-box
          chmod +x bin/sing-box
          bin/mihomo -v
          bin/sing-box version

      - name: Fetch previous release snapshot
        run: |
          set +e
          mkdir -p .cache/previous-dist
          git fetch --depth=1 origin release
          git show FETCH_HEAD:manifest.json > .cache/previous-manifest.json
          git archive FETCH_HEAD rules | tar -x -C .cache/previous-dist
          true

      - name: Build and validate
        run: |
          uv run python -m builder build \
            --mihomo-bin "$PWD/bin/mihomo" \
            --singbox-bin "$PWD/bin/sing-box" \
            --previous-manifest .cache/previous-manifest.json \
            --previous-dist .cache/previous-dist \
            --check-domains \
            --validate

      - name: Install pinned ucode for router adapter tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libjson-c-dev pkg-config
          mkdir -p .cache/ucode-src
          curl -fsSL "https://github.com/jow-/ucode/archive/a2c42eac6369a0bba0315007c7dc7b7130275340.tar.gz" | tar -xz --strip-components=1 -C .cache/ucode-src
          cmake -S .cache/ucode-src -B .cache/ucode-build -DFS_SUPPORT=ON \
            -DUCI_SUPPORT=OFF -DUBUS_SUPPORT=OFF -DULOOP_SUPPORT=OFF \
            -DNL80211_SUPPORT=OFF -DRTNL_SUPPORT=OFF -DRESOLV_SUPPORT=OFF \
            -DSTRUCT_SUPPORT=OFF -DMATH_SUPPORT=OFF -DSOCKET_SUPPORT=OFF \
            -DIO_SUPPORT=OFF -DZLIB_SUPPORT=OFF -DDIGEST_SUPPORT=OFF \
            -DFFI_SUPPORT=OFF -DNETADDR_SUPPORT=OFF -DSERIAL_SUPPORT=OFF \
            -DLOG_SUPPORT=OFF -DDEBUG_SUPPORT=OFF
          cmake --build .cache/ucode-build -j2 --target ucode fs_lib

      - name: Test
        env:
          ROUTEMINT_MIHOMO_BIN: ${{ github.workspace }}/bin/mihomo
          ROUTEMINT_SINGBOX_BIN: ${{ github.workspace }}/bin/sing-box
        run: uv run pytest

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/
            CHANGELOG.md
          retention-days: 7

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      UV_CACHE_DIR: .cache/uv
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: .

      - name: Read previous manifest
        run: |
          set +e
          git fetch --depth=1 origin release
          git show FETCH_HEAD:manifest.json > /tmp/previous-manifest.json 2>/dev/null
          rm -f /tmp/empty
          true

      - name: Compute release info
        id: info
        run: |
          set -euo pipefail
          TAG="build-$(date -u +%Y%m%d-%H%M)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          uv run python -m builder publish \
            --dist dist \
            --previous /tmp/previous-manifest.json \
            --tag "$TAG" \
            --notes-out /tmp/notes.md \
            --changed-out /tmp/changed.json \
            --changelog CHANGELOG.md
          uv run python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          info = json.load(open("/tmp/changed.json"))
          print(f"content_changed={str(info['content_changed']).lower()}")
          print(f"changed_count={info['count']}")
          PY

      - name: Push release branch
        if: steps.info.outputs.content_changed == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/release && mkdir -p /tmp/release && cd /tmp/release
          git init -q -b release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -r "$GITHUB_WORKSPACE/dist/." .
          cp "$GITHUB_WORKSPACE/CHANGELOG.md" .
          git add -A
          git commit -q -m "release: ${{ steps.info.outputs.tag }}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" release

      - name: Purge jsDelivr cache
        if: steps.info.outputs.content_changed == 'true'
        run: uv run python -m builder purge --changed /tmp/changed.json --root .

      - name: Create GitHub release
        if: steps.info.outputs.content_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.info.outputs.tag }}" \
            --title "规则更新 $(date -u +%Y-%m-%d)" \
            --target release \
            --notes-file /tmp/notes.md

      - name: Commit changelog to main
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- CHANGELOG.md; then
            echo "changelog unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -q -m "chore: changelog $(date -u +%F) [skip ci]"
          git push origin HEAD:main
