[project]
name = "routemint-rules"
version = "0.1.0"
description = "Scene-based proxy routing rules, built and published daily."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "PyYAML>=6,<7",
    "Jinja2>=3.1,<4",
    "segno>=1.6.6",
]

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "pytest>=8,<10",
    "zxing-cpp>=3.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# `uv run pytest` uses the console script, which does not put the repo root on
# sys.path the way `python -m pytest` does.
pythonpath = ["."]
