[project]
name = "routemint-rules"
version = "0.1.0"
description = "Scene-based proxy routing rules, built and published daily."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "PyYAML>=6,<7",
    "Jinja2>=3.1,<4",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
