id: youtube
meta:
  description: YouTube 及视频 CDN
  strategy: "📺 YouTube"
  notes: googlevideo.com 是实际视频流量的承载体，单独补上，避免只代理了页面。
include:
  - upstream: v2fly-dlc
    categories: [youtube]
add:
  - DOMAIN-SUFFIX,googlevideo.com
  - DOMAIN-SUFFIX,ytimg.com
  - DOMAIN-SUFFIX,youtu.be
  - DOMAIN-SUFFIX,youtube-nocookie.com
  - DOMAIN-SUFFIX,yt3.ggpht.com
