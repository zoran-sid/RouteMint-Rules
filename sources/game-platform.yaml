id: game-platform
meta:
  description: 游戏商店、社区与联机服务
  strategy: "🌍 境外服务"
  notes: 与 game-download 重叠的下载域名会被优先级裁掉，Steam 仅保留商店与社区；其他平台保留商店/社区/联机部分。
include:
  - upstream: v2fly-dlc
    categories: [epicgames]
  - upstream: v2fly-dlc
    categories: [playstation]
  - upstream: v2fly-dlc
    categories: [xbox]
  - upstream: v2fly-dlc
    categories: [nintendo]
  - upstream: v2fly-dlc
    categories: [blizzard, ea, ubisoft, gog, riot, rockstar, bethesda]
add:
  # Steam 只代理商店与社区；登录/API/连接管理由 steam-direct 接管。
  - DOMAIN-SUFFIX,store.steampowered.com
  - DOMAIN-SUFFIX,steamcommunity.com
