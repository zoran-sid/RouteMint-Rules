id: ai-others
meta:
  description: 其他 AI 服务（对话、绘图、语音、模型托管）
  strategy: "🤖 AI 服务"
  regions_available: [US, JP, SG, TW, GB, DE, NL, CA, AU]
  regions_restricted: [CN, HK, MO, RU, IR, KP, SY, CU]
  notes: |
    只收「站点级」域名，不用 DOMAIN-KEYWORD，避免误伤普通网站。
    国内可直接访问的 AI 服务（如 DeepSeek、通义、豆包）不放这里。
  references:
    - https://github.com/v2fly/domain-list-community/blob/master/data/category-ai-!cn
include:
  - upstream: v2fly-dlc
    categories: [category-ai-!cn]
