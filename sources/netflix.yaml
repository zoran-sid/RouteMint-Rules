id: netflix
meta:
  description: Netflix
  strategy: "🎬 Netflix"
  notes: 流媒体按服务拆组，方便按片源库选节点（不同地区片源不同）。
include:
  - upstream: v2fly-dlc
    categories: [netflix]
add:
  - DOMAIN-SUFFIX,netflix.com
  - DOMAIN-SUFFIX,netflix.net
  - DOMAIN-SUFFIX,nflxvideo.net
  - DOMAIN-SUFFIX,nflximg.net
  - DOMAIN-SUFFIX,nflxext.com
  - DOMAIN-SUFFIX,nflxso.net
  # 上游含动态 AWS API 主机正则；跨客户端使用基础设施专用关键字补齐。
  # 不将 amazonaws.com / cloudfront.net 这类共享 CDN 整体送入 Netflix。
  - rule: DOMAIN-KEYWORD,apiproxy-device-prod-nlb-
    reason: Netflix 设备 API 动态 AWS 主机，补齐上游无法转换的正则规则。
  - rule: DOMAIN-KEYWORD,apiproxy-website-nlb-prod-
    reason: Netflix 网页 API 动态 AWS 主机，补齐上游无法转换的正则规则。
  - rule: DOMAIN-KEYWORD,dualstack.apiproxy-
    reason: Netflix 双栈 API 动态 AWS 主机，补齐上游无法转换的正则规则。
  - rule: DOMAIN-KEYWORD,dualstack.ichnaea-web-
    reason: Netflix 双栈遥测 API 动态 AWS 主机，保持与播放 API 相同出口。
