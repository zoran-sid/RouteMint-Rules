id: game-download
meta:
  description: 游戏下载 CDN（体积大、可直连）
  strategy: "🎯 全球直连"
  notes: |
    只放纯下载域名。商店、社区、联机服务在 game-platform 里走代理。
    所有场景直连，并使用本地 DNS，供平台选择当前地区下载 CDN。
    同步上游下载专用分类，覆盖 Steam、Battle.net、Epic、EA、Ubisoft、
    GOG、Riot、Rockstar、Bethesda、Xbox 等；不整站代理共享 CDN。
include:
  - upstream: v2fly-dlc
    categories: [category-game-platforms-download]
add:
  - DOMAIN,download.steampowered.com
  - DOMAIN,client-update.queniuqe.com
  - DOMAIN-SUFFIX,steamcontent.com
  - DOMAIN-SUFFIX,steamstatic.com
  - DOMAIN-SUFFIX,steamcdn-a.akamaihd.net
  - DOMAIN-SUFFIX,steamcontent.co.uk
  - DOMAIN-SUFFIX,epicgames-download1.akamaized.net
  - DOMAIN-SUFFIX,download.epicgames.com
  - DOMAIN-SUFFIX,cdn1.epicgames.com
  - DOMAIN-SUFFIX,cdn2.epicgames.com
  - DOMAIN-SUFFIX,cdn3.epicgames.com
  - DOMAIN-SUFFIX,assets1.xboxlive.com
  - DOMAIN-SUFFIX,assets2.xboxlive.com
  - DOMAIN-SUFFIX,cdn.playstation.net
  - DOMAIN-SUFFIX,gs2.ww.prod.dl.playstation.net
  - DOMAIN-SUFFIX,cdn.nintendo.net
  - DOMAIN-SUFFIX,origin-a.akamaihd.net
remove:
  - {value: recommendations-api.gog.com, reason: 推荐 API 属于商店功能，不属于游戏下载。}
  - {value: sections.gog.com, reason: 商店页面接口，不属于游戏下载。}
  - {value: galaxy-promos.gog.com, reason: 商店推广接口，不属于游戏下载。}
  - {value: marketing-sections.gog.com, reason: 商店推广接口，不属于游戏下载。}
