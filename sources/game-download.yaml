id: game-download
meta:
  description: 游戏下载 CDN（体积大、可直连）
  strategy: "🎯 全球直连"
  notes: |
    只放纯下载域名。商店、社区、联机服务在 game-platform 里走代理。
    下载 CDN 通常有中国大陆节点，直连比代理快得多，也省机场流量。
