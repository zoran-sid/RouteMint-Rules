id: reject-tracker
meta:
  description: 常见追踪器、分析 SDK、归因与热图服务
  strategy: REJECT
  notes: |
    只保留「拦掉不会破坏正常功能」的高频追踪域名（手工精选 + 上游 Marketing 分类）。
    故意不收国内统计 SDK（友盟、GrowingIO 等），轻度档拦截它们会拖垮部分国产 App。
  references:
    - https://github.com/ShadowWhisperer/BlockLists
include:
  - upstream: shadowwhisperer
    categories: [Marketing]
