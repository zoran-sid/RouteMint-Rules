id: tiktok
meta:
  description: TikTok（不含抖音）
  strategy: "🎬 TikTok"
  regions_restricted: [CN, HK]
  notes: TikTok 对大陆/香港出口同样不友好，策略组默认排除这些地区节点。
include:
  - upstream: v2fly-dlc
    categories: [tiktok]
add:
  - DOMAIN-SUFFIX,tiktokcdn.com
  - DOMAIN-SUFFIX,tiktokv.com
  - DOMAIN-SUFFIX,muscdn.com
  - DOMAIN-SUFFIX,ibytedtos.com
