# RouteMint-Rules · 身在中国大陆 · ads-light
# 由 builder 自动生成，请勿手工编辑。预设说明：国内域名与 IP 直连；境外服务走代理；AI 与流媒体各自成组；广告拦截默认轻度；无法判断的流量优先走代理。
#
# 使用前只需改一处：把 proxy-providers.airport.url 换成你自己的机场订阅地址。
# 本文件不含任何节点、订阅或密钥。
#
# 规则顺序：private → reject → ai → 流媒体 → 回国 → dev → game → telegram
#           → apple/microsoft/google → proxy → cn → cn-ip → MATCH
# 顺序即路由契约，改动请改 presets/cn-mainland.yaml 而不是这里。

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: "off"

profile:
  store-selected: true
  store-fake-ip: true

# 嗅探让域名在 fake-ip 模式下仍是域名，代理端可自行解析，避免本地 DNS 泄漏。
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "localhost.ptlogin2.qq.com"
  # 海外使用当前网络 DNS；大陆使用国内 DoH。节点域名独立解析，避免递归。
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  # 服务 DNS 经同一策略组发出；切换服务出口时，DNS 同步切换。
  nameserver-policy:
    "rule-set:private":
      - "system"
    "rule-set:ai-openai":
      - "https://1.1.1.1/dns-query#🤖 AI 服务"
    "rule-set:ai-anthropic":
      - "https://1.1.1.1/dns-query#🤖 AI 服务"
    "rule-set:ai-gemini":
      - "https://1.1.1.1/dns-query#🤖 AI 服务"
    "rule-set:ai-copilot":
      - "https://1.1.1.1/dns-query#🤖 AI 服务"
    "rule-set:ai-perplexity":
      - "https://1.1.1.1/dns-query#🤖 AI 服务"
    "rule-set:ai-others":
      - "https://1.1.1.1/dns-query#🤖 AI 服务"
    "rule-set:netflix":
      - "https://1.1.1.1/dns-query#🎬 Netflix"
    "rule-set:disney":
      - "https://1.1.1.1/dns-query#🎬 Disney+"
    "rule-set:youtube":
      - "https://1.1.1.1/dns-query#📺 YouTube"
    "rule-set:spotify":
      - "https://1.1.1.1/dns-query#🎵 Spotify"
    "rule-set:tiktok":
      - "https://1.1.1.1/dns-query#🎬 TikTok"
    "rule-set:max":
      - "https://1.1.1.1/dns-query#🎬 Max"
    "rule-set:primevideo":
      - "https://1.1.1.1/dns-query#🎬 Prime Video"
    "rule-set:streaming-others":
      - "https://1.1.1.1/dns-query#📺 其他流媒体"
    "rule-set:dev":
      - "https://1.1.1.1/dns-query#🌍 境外服务"
    "rule-set:game-download":
      - "system"
    "rule-set:baidu-pan":
      - "system"
    "rule-set:game-platform":
      - "https://1.1.1.1/dns-query#🌍 境外服务"
    "rule-set:telegram":
      - "https://1.1.1.1/dns-query#🌍 境外服务"
    "rule-set:apple":
      - "https://1.1.1.1/dns-query#🎯 全球直连"
    "rule-set:microsoft":
      - "https://1.1.1.1/dns-query#🎯 全球直连"
    "rule-set:google":
      - "https://1.1.1.1/dns-query#🌍 境外服务"
    "rule-set:proxy":
      - "https://1.1.1.1/dns-query#🌍 境外服务"
    "rule-set:cn":
      - "https://dns.alidns.com/dns-query#🎯 全球直连"

proxy-providers:
  airport:
    type: http
    # TODO: 换成你的机场订阅地址（支持 Clash/mihomo 格式订阅）。
    url: "https://sub.example.com/api/v1/client/subscribe?token=YOUR_TOKEN"
    interval: 86400
    path: ./providers/airport.yaml
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      lazy: false

proxy-groups:
