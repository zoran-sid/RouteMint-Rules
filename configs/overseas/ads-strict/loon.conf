# RouteMint-Rules · 身在海外 · ads-strict
# 由 builder 自动生成，请勿手工编辑。
#
# 节点：Loon 支持在配置里声明订阅（[Remote Proxy]），把 Airport 那一行换成你的订阅地址即可。
# 规则：远程规则放在 [Remote Rule]，本地只保留 FINAL。
# 文档：https://nsloon.app/docs/Node/subscription

[General]
ipv6 = false
dns-server = 223.5.5.5, 119.29.29.29
proxy-test-url = http://www.gstatic.com/generate_204

[Remote Proxy]
Airport = https://sub.example.com/api/v1/client/subscribe?token=YOUR_TOKEN&flag=loon

[Remote Filter]
f-ai-auto = NameRegex,Airport,FilterKey = (?i)(美国|\bus\b|united states|日本|\bjp\b|japan|新加坡|\bsg\b|singapore|台湾|\btw\b|taiwan|韩国|\bkr\b|korea|英国|\buk\b|united kingdom|德国|\bde\b|germany|荷兰|\bnl\b|netherlands|加拿大|\bca\b|canada|澳大利亚|\bau\b|australia|法国|\bfr\b|france)

[Proxy Group]
🚀 节点选择 = select, Airport, ♻️ 自动选择, 🎯 全球直连
♻️ 自动选择 = url-test, Airport, url=https://www.gstatic.com/generate_204, interval=300
🤖 AI 服务 = select, Airport, ♻️ AI 自动选择, 🎯 全球直连
