🌍 流媒体 = select, Airport, ♻️ 自动选择, 🎯 全球直连
🎯 全球直连 = select, DIRECT
🛑 广告拦截 = select, REJECT
🐟 漏网之鱼 = select, 🎯 全球直连, 🚀 节点选择

