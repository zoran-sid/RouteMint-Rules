# RouteMint-Rules · 身在海外 · ads-strict
# 由 builder 自动生成，请勿手工编辑。
#
# 节点：Quantumult X 用 [server_remote] 声明订阅，把 Airport 那一行换成你的订阅地址。
# 规则：用 [filter_remote] 引用本仓库的 QX 规则文件，策略由 force-policy 指定。
# 注意：QX 不支持整份远程配置自动更新，只能靠 [server_remote]/[filter_remote] 自己刷新；
#       想一键更新规则请用 quantumult-x:///update-configuration 方案（见 README）。

[general]
server_check_url = http://www.gstatic.com/generate_204
dns_exclusion_list = *.lan, *.local

[dns]
no-ipv6
server = 223.5.5.5
server = 119.29.29.29
doh-server = https://dns.alidns.com/dns-query, https://doh.pub/dns-query

[server_remote]
https://sub.example.com/api/v1/client/subscribe?token=YOUR_TOKEN&flag=quantumultx, tag=Airport, update-interval=86400, enabled=true

[policy]
static = 🚀 节点选择, resource-tag-regex=^Airport$
url-latency-benchmark = ♻️ 自动选择, resource-tag-regex=^Airport$, check-interval=300, tolerance=0
static = 🤖 AI 服务, resource-tag-regex=^Airport$
url-latency-benchmark = ♻️ AI 自动选择, resource-tag-regex=^Airport$, check-interval=300, tolerance=0
static = 🌍 流媒体, resource-tag-regex=^Airport$
static = 🐟 漏网之鱼, resource-tag-regex=^Airport$

