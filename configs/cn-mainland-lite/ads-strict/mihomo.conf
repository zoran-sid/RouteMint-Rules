# RouteMint-Rules · 大陆 · 极简 · ads-strict
# 由 builder 自动生成，请勿手工编辑。预设说明：不拆流媒体，不区分具体服务：保留局域网、广告、AI、游戏平台下载、百度网盘、国内域名、国内 IP，其余全部交给节点选择。规则条数约为标准版的一半。
#
# 使用前只需改一处：把 proxy-providers.airport.url 换成你自己的机场订阅地址。
# 本文件不含任何节点、订阅或密钥。
#
# 规则顺序：private → reject → ai → 流媒体 → 回国 → dev → game → telegram
#           → apple/microsoft/google → proxy → cn → cn-ip → MATCH
# 顺序即路由契约，改动请改 presets/cn-mainland-lite.yaml 而不是这里。

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: "off"

profile:
  store-selected: true
  store-fake-ip: true

# 嗅探让域名在 fake-ip 模式下仍是域名，代理端可自行解析，避免本地 DNS 泄漏。
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "localhost.ptlogin2.qq.com"
  # 海外使用当前网络 DNS；大陆使用国内 DoH。节点域名独立解析，避免递归。
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  # 服务 DNS 经同一策略组发出；切换服务出口时，DNS 同步切换。
  nameserver-policy:
    "rule-set:private":
      - "system"
    "rule-set:ai":
      - "https://1.1.1.1/dns-query#🤖 AI 服务"
    "rule-set:game-download":
      - "system"
    "rule-set:baidu-pan":
      - "system"
    "rule-set:game-platform":
      - "https://1.1.1.1/dns-query#🚀 节点选择"
    "rule-set:steam-direct":
      - "system"
    "rule-set:cn":
      - "https://dns.alidns.com/dns-query#🎯 全球直连"

proxy-providers:
  airport:
    type: http
    # TODO: 换成你的机场订阅地址（支持 Clash/mihomo 格式订阅）。
    url: "https://sub.example.com/api/v1/client/subscribe?token=YOUR_TOKEN"
    interval: 86400
    path: ./providers/airport.yaml
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      lazy: false

proxy-groups:
  - name: "🚀 节点选择"
    type: select
    use:
      - airport
    proxies:
      - "♻️ 自动选择"
      - "🎯 全球直连"
  - name: "♻️ 自动选择"
    type: url-test
    use:
      - airport
    exclude-filter: '(?i)(?:^|[^a-z])(?:香港|港|hong ?kong|hk|澳门|macau|macao|mo|中国|大陆|cn|china|上海|北京|广州|深圳|杭州|成都|南京|武汉|回国|🇭🇰|🇲🇴|🇨🇳)(?:[^a-z]|$)'
    url: https://www.gstatic.com/generate_204
    interval: 300
  - name: "🤖 AI 服务"
    type: select
    use:
      - airport
    proxies:
      - "♻️ AI 自动选择"
      - "🚀 节点选择"
      - "🎯 全球直连"
    exclude-filter: '(?i)(?:^|[^a-z])(?:香港|港|hong ?kong|hk|澳门|macau|macao|mo|中国|大陆|cn|china|伊朗|iran|ir|朝鲜|kp|叙利亚|sy|古巴|cu|俄罗斯|russia|moscow|ru|上海|北京|广州|深圳|杭州|成都|南京|武汉|回国|🇭🇰|🇲🇴|🇨🇳|🇮🇷|🇰🇵|🇸🇾|🇨🇺|🇷🇺)(?:[^a-z]|$)'
  - name: "♻️ AI 自动选择"
    type: url-test
    use:
      - airport
    exclude-filter: '(?i)(?:^|[^a-z])(?:香港|港|hong ?kong|hk|澳门|macau|macao|mo|中国|大陆|cn|china|伊朗|iran|ir|朝鲜|kp|叙利亚|sy|古巴|cu|俄罗斯|russia|moscow|ru|上海|北京|广州|深圳|杭州|成都|南京|武汉|回国|🇭🇰|🇲🇴|🇨🇳|🇮🇷|🇰🇵|🇸🇾|🇨🇺|🇷🇺)(?:[^a-z]|$)'
    url: https://www.gstatic.com/generate_204
    interval: 300
  - name: "🎯 全球直连"
    type: select
    proxies:
      - "DIRECT"
  - name: "🛑 广告拦截"
    type: select
    proxies:
      - "REJECT"
  - name: "🐟 漏网之鱼"
    type: select
    proxies:
      - "🚀 节点选择"
      - "🎯 全球直连"

rules:
  - RULE-SET,private,🎯 全球直连
  - RULE-SET,private-ip,🎯 全球直连
  - RULE-SET,reject-malware,🛑 广告拦截
  - RULE-SET,reject-tracker,🛑 广告拦截
  - RULE-SET,reject-ads,🛑 广告拦截
  - RULE-SET,ai,🤖 AI 服务
  - RULE-SET,game-download,🎯 全球直连
  - RULE-SET,baidu-pan,🎯 全球直连
  - RULE-SET,game-platform,🚀 节点选择
  - RULE-SET,steam-direct,🎯 全球直连
  - RULE-SET,steam-direct-ip,🎯 全球直连,no-resolve
  - RULE-SET,cn,🎯 全球直连
  - RULE-SET,cn-ip,🎯 全球直连,no-resolve
  - MATCH,🐟 漏网之鱼

