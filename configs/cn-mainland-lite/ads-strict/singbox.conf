{
  "log": {
    "level": "info",
    "timestamp": true
  },
  "dns": {
    "servers": [
      {
        "type": "local",
        "tag": "local"
      },
      {
        "type": "https",
        "tag": "domestic",
        "server": "223.5.5.5",
        "path": "/dns-query",
        "tls": {
          "server_name": "dns.alidns.com"
        },
        "detour": "direct"
      },
      {
        "type": "https",
        "tag": "dns-remote-ai",
        "server": "1.1.1.1",
        "path": "/dns-query",
        "detour": "ai"
      },
      {
        "type": "https",
        "tag": "dns-cn-g-direct",
        "server": "223.5.5.5",
        "path": "/dns-query",
        "detour": "g-direct",
        "tls": {
          "server_name": "dns.alidns.com"
        }
      }
    ],
    "rules": [
      {
        "rule_set": "rs-private",
        "server": "local"
      },
      {
        "rule_set": "rs-ai",
        "server": "dns-remote-ai"
      },
      {
        "rule_set": "rs-cn",
        "server": "dns-cn-g-direct"
      }
    ],
    "final": "domestic",
    "strategy": "prefer_ipv4"
  },
  "inbounds": [
    {
      "type": "tun",
      "tag": "tun-in",
      "address": [
        "172.19.0.1/30"
      ],
      "auto_route": true,
      "strict_route": true
    }
  ],
  "outbounds": [
    {
      "type": "selector",
      "tag": "proxy",
      "outbounds": [
        "auto",
        "g-direct",
        "airport"
      ],
      "default": "auto"
    },
    {
      "type": "urltest",
      "tag": "auto",
      "outbounds": [
        "airport"
      ],
      "url": "https://www.gstatic.com/generate_204",
      "interval": "300s"
    },
    {
      "type": "selector",
      "tag": "ai",
      "outbounds": [
        "ai-auto",
        "proxy",
        "g-direct",
        "airport"
      ],
      "default": "ai-auto"
    },
    {
      "type": "urltest",
      "tag": "ai-auto",
      "outbounds": [
        "airport"
      ],
      "url": "https://www.gstatic.com/generate_204",
      "interval": "300s"
    },
    {
      "type": "selector",
      "tag": "g-direct",
      "outbounds": [
        "direct"
      ],
      "default": "direct"
    },
    {
      "type": "selector",
      "tag": "reject",
      "outbounds": [
        "block"
      ],
      "default": "block"
    },
    {
      "type": "selector",
      "tag": "final",
      "outbounds": [
        "proxy",
        "g-direct"
      ],
      "default": "proxy"
    },
    {
      "type": "socks",
      "tag": "airport",
      "server": "127.0.0.1",
      "server_port": 1080
    },
    {
      "type": "direct",
      "tag": "direct"
    },
    {
      "type": "block",
      "tag": "block"
    }
  ],
  "route": {
    "rules": [
      {
        "action": "sniff"
      },
      {
        "protocol": "dns",
        "action": "hijack-dns"
      },
      {
        "rule_set": "rs-private",
        "outbound": "g-direct"
      },
      {
        "rule_set": "rs-reject-malware",
        "outbound": "reject"
      },
      {
        "rule_set": "rs-reject-tracker",
        "outbound": "reject"
      },
      {
        "rule_set": "rs-reject-ads",
        "outbound": "reject"
      },
      {
        "rule_set": "rs-ai",
        "outbound": "ai"
      },
      {
        "rule_set": "rs-cn",
        "outbound": "g-direct"
      },
      {
        "rule_set": "rs-cn-ip",
        "outbound": "g-direct"
      }
    ],
    "rule_set": [
      {
        "type": "remote",
        "tag": "rs-private",
        "format": "binary",
        "url": "https://cdn.jsdelivr.net/gh/zoran-sid/RouteMint-Rules@release/rules/private/private.srs",
        "download_detour": "proxy"
      },
      {
        "type": "remote",
        "tag": "rs-reject-malware",
        "format": "binary",
        "url": "https://cdn.jsdelivr.net/gh/zoran-sid/RouteMint-Rules@release/rules/reject-malware/reject-malware.srs",
        "download_detour": "proxy"
      },
      {
        "type": "remote",
        "tag": "rs-reject-tracker",
        "format": "binary",
        "url": "https://cdn.jsdelivr.net/gh/zoran-sid/RouteMint-Rules@release/rules/reject-tracker/reject-tracker.srs",
        "download_detour": "proxy"
      },
      {
        "type": "remote",
        "tag": "rs-reject-ads",
        "format": "binary",
        "url": "https://cdn.jsdelivr.net/gh/zoran-sid/RouteMint-Rules@release/rules/reject-ads/reject-ads.srs",
        "download_detour": "proxy"
      },
      {
        "type": "remote",
        "tag": "rs-ai",
        "format": "binary",
        "url": "https://cdn.jsdelivr.net/gh/zoran-sid/RouteMint-Rules@release/rules/ai/ai.srs",
        "download_detour": "proxy"
      },
      {
        "type": "remote",
        "tag": "rs-cn",
        "format": "binary",
        "url": "https://cdn.jsdelivr.net/gh/zoran-sid/RouteMint-Rules@release/rules/cn/cn.srs",
        "download_detour": "proxy"
      },
      {
        "type": "remote",
        "tag": "rs-cn-ip",
        "format": "binary",
        "url": "https://cdn.jsdelivr.net/gh/zoran-sid/RouteMint-Rules@release/rules/cn-ip/cn-ip.srs",
        "download_detour": "proxy"
      }
    ],
    "final": "final",
    "default_domain_resolver": {
      "server": "domestic"
    }
  }
}
