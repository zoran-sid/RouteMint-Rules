        "download_detour": "direct"
      },
      {
        "type": "remote",
        "tag": "rs-ai-others",
        "format": "binary",
        "url": "https://cdn.jsdelivr.net/gh/zoran-sid/RouteMint-Rules@release/rules/ai-others/ai-others.srs",
        "download_detour": "direct"
      },
      {
        "type": "remote",
        "tag": "rs-cn-region-locked",
        "format": "binary",
        "url": "https://cdn.jsdelivr.net/gh/zoran-sid/RouteMint-Rules@release/rules/cn-region-locked/cn-region-locked.srs",
        "download_detour": "direct"
      },
      {
        "type": "remote",
        "tag": "rs-game-download",
        "format": "binary",
        "url": "https://cdn.jsdelivr.net/gh/zoran-sid/RouteMint-Rules@release/rules/game-download/game-download.srs",
        "download_detour": "direct"
      },
      {
        "type": "remote",
        "tag": "rs-baidu-pan",
        "format": "binary",
        "url": "https://cdn.jsdelivr.net/gh/zoran-sid/RouteMint-Rules@release/rules/baidu-pan/baidu-pan.srs",
        "download_detour": "direct"
      },
      {
        "type": "remote",
        "tag": "rs-game-platform",
        "format": "binary",
        "url": "https://cdn.jsdelivr.net/gh/zoran-sid/RouteMint-Rules@release/rules/game-platform/game-platform.srs",
        "download_detour": "direct"
      },
      {
        "type": "remote",
