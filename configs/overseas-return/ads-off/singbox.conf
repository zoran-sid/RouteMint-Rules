        "url": "https://cdn.jsdelivr.net/gh/zoran-sid/RouteMint-Rules@release/rules/cn/cn.srs",
        "download_detour": "direct"
      },
      {
        "type": "remote",
        "tag": "rs-cn-ip",
        "format": "binary",
        "url": "https://cdn.jsdelivr.net/gh/zoran-sid/RouteMint-Rules@release/rules/cn-ip/cn-ip.srs",
        "download_detour": "direct"
      },
      {
        "type": "remote",
        "tag": "rs-cn-ip6",
        "format": "binary",
        "url": "https://cdn.jsdelivr.net/gh/zoran-sid/RouteMint-Rules@release/rules/cn-ip6/cn-ip6.srs",
        "download_detour": "direct"
      }
    ],
    "final": "final",
    "default_domain_resolver": {
      "server": "local"
    }
  }
}
