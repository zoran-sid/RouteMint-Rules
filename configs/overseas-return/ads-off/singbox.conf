{
  "log": {
    "level": "info",
    "timestamp": true
  },
  "dns": {
    "servers": [
      {
        "type": "local",
        "tag": "local"
      },
      {
        "type": "https",
        "tag": "domestic",
        "server": "223.5.5.5",
        "path": "/dns-query",
        "tls": {
          "server_name": "dns.alidns.com"
        },
        "detour": "direct"
      },
      {
        "type": "https",
        "tag": "dns-remote-ai",
        "server": "1.1.1.1",
        "path": "/dns-query",
        "detour": "ai"
      },
      {
        "type": "https",
        "tag": "dns-cn-cn-return",
        "server": "223.5.5.5",
        "path": "/dns-query",
        "detour": "cn-return",
        "tls": {
          "server_name": "dns.alidns.com"
        }
      },
      {
        "type": "https",
        "tag": "dns-remote-proxy",
        "server": "1.1.1.1",
        "path": "/dns-query",
        "detour": "proxy"
      },
      {
        "type": "https",
        "tag": "dns-cn-g-direct",
        "server": "223.5.5.5",
        "path": "/dns-query",
        "detour": "g-direct",
        "tls": {
          "server_name": "dns.alidns.com"
        }
      }
    ],
    "rules": [
      {
        "rule_set": "rs-private",
        "server": "local"
      },
      {
        "rule_set": "rs-ai-openai",
        "server": "dns-remote-ai"
      },
      {
        "rule_set": "rs-ai-anthropic",
        "server": "dns-remote-ai"
      },
      {
        "rule_set": "rs-ai-gemini",
        "server": "dns-remote-ai"
      },
      {
        "rule_set": "rs-ai-copilot",
        "server": "dns-remote-ai"
      },
      {
        "rule_set": "rs-ai-perplexity",
        "server": "dns-remote-ai"
      },
      {
        "rule_set": "rs-ai-others",
        "server": "dns-remote-ai"
      },
      {
        "rule_set": "rs-cn-region-locked",
        "server": "dns-cn-cn-return"
      },
      {
        "rule_set": "rs-game-download",
        "server": "local"
      },
      {
        "rule_set": "rs-baidu-pan",
        "server": "local"
      },
      {
        "rule_set": "rs-game-platform",
        "server": "dns-remote-proxy"
      },
      {
        "rule_set": "rs-cn",
        "server": "dns-cn-g-direct"
      }
    ],
    "final": "local",
    "strategy": "prefer_ipv4"
  },
  "inbounds": [
    {
      "type": "tun",
      "tag": "tun-in",
      "address": [
        "172.19.0.1/30"
      ],
      "auto_route": true,
      "strict_route": true
    }
  ],
  "outbounds": [
    {
      "type": "selector",
      "tag": "proxy",
      "outbounds": [
        "auto",
        "g-direct",
        "airport"
      ],
      "default": "auto"
    },
    {
      "type": "urltest",
      "tag": "auto",
      "outbounds": [
        "airport"
      ],
      "url": "https://www.gstatic.com/generate_204",
      "interval": "300s"
    },
    {
      "type": "selector",
      "tag": "cn-return",
      "outbounds": [
        "block",
        "airport"
      ],
      "default": "block"
    },
    {
      "type": "selector",
      "tag": "ai",
      "outbounds": [
        "g-direct",
        "ai-auto",
        "proxy",
        "airport"
      ],
      "default": "g-direct"
    },
    {
      "type": "urltest",
      "tag": "ai-auto",
      "outbounds": [
        "airport"
      ],
      "url": "https://www.gstatic.com/generate_204",
      "interval": "300s"
    },
    {
      "type": "selector",
      "tag": "g-direct",
      "outbounds": [
        "direct"
      ],
      "default": "direct"
    },
    {
      "type": "selector",
      "tag": "reject",
      "outbounds": [
        "block"
      ],
      "default": "block"
    },
    {
      "type": "selector",
      "tag": "final",
      "outbounds": [
        "g-direct",
        "proxy"
      ],
      "default": "g-direct"
    },
    {
      "type": "socks",
      "tag": "airport",
      "server": "127.0.0.1",
      "server_port": 1080
    },
    {
      "type": "direct",
      "tag": "direct"
    },
    {
      "type": "block",
      "tag": "block"
    }
  ],
  "route": {
    "rules": [
      {
        "action": "sniff"
      },
      {
        "protocol": "dns",
        "action": "hijack-dns"
      },
      {
        "rule_set": "rs-private",
        "outbound": "g-direct"
      },
      {
        "rule_set": "rs-ai-openai",
        "outbound": "ai"
      },
      {
        "rule_set": "rs-ai-anthropic",
        "outbound": "ai"
      },
      {
        "rule_set": "rs-ai-gemini",
        "outbound": "ai"
      },
      {
        "rule_set": "rs-ai-copilot",
        "outbound": "ai"
      },
      {
        "rule_set": "rs-ai-perplexity",
        "outbound": "ai"
      },
      {
        "rule_set": "rs-ai-others",
        "outbound": "ai"
      },
      {
        "rule_set": "rs-cn-region-locked",
        "outbound": "cn-return"
      },
      {
        "rule_set": "rs-game-download",
        "outbound": "g-direct"
      },
      {
        "rule_set": "rs-baidu-pan",
        "outbound": "g-direct"
      },
      {
        "rule_set": "rs-game-platform",
        "outbound": "proxy"
      },
      {
        "rule_set": "rs-cn",
        "outbound": "g-direct"
      },
      {
        "rule_set": "rs-cn-ip",
        "outbound": "g-direct"
      },
      {
        "rule_set": "rs-cn-ip6",
        "outbound": "g-direct"
      }
    ],
    "rule_set": [
      {
        "type": "remote",
        "tag": "rs-private",
        "format": "binary",
        "url": "https://cdn.jsdelivr.net/gh/zoran-sid/RouteMint-Rules@release/rules/private/private.srs",
        "download_detour": "direct"
      },
      {
        "type": "remote",
        "tag": "rs-ai-openai",
        "format": "binary",
        "url": "https://cdn.jsdelivr.net/gh/zoran-sid/RouteMint-Rules@release/rules/ai-openai/ai-openai.srs",
        "download_detour": "direct"
      },
      {
        "type": "remote",
        "tag": "rs-ai-anthropic",
        "format": "binary",
        "url": "https://cdn.jsdelivr.net/gh/zoran-sid/RouteMint-Rules@release/rules/ai-anthropic/ai-anthropic.srs",
        "download_detour": "direct"
      },
      {
