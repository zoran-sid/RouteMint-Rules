        "url": "https://cdn.jsdelivr.net/gh/zoran-sid/RouteMint-Rules@release/rules/ai-gemini/ai-gemini.srs",
        "download_detour": "direct"
      },
      {
        "type": "remote",
        "tag": "rs-ai-copilot",
        "format": "binary",
        "url": "https://cdn.jsdelivr.net/gh/zoran-sid/RouteMint-Rules@release/rules/ai-copilot/ai-copilot.srs",
        "download_detour": "direct"
      },
      {
