# RouteMint-Rules · 海外华人回国 · ads-off
# 由 builder 自动生成，请勿手工编辑。预设说明：默认全部直连；中国大陆限区内容走「回国」组（按节点名自动筛出国内节点）；AI 组默认直连，遇到不可用时可一键切到代理节点。
#
# 使用前只需改一处：把 proxy-providers.airport.url 换成你自己的机场订阅地址。
# 本文件不含任何节点、订阅或密钥。
#
# 规则顺序：private → reject → ai → 流媒体 → 回国 → dev → game → telegram
#           → apple/microsoft/google → proxy → cn → cn-ip → MATCH
# 顺序即路由契约，改动请改 presets/overseas-return.yaml 而不是这里。

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: "off"

profile:
  store-selected: true
  store-fake-ip: true

# 嗅探让域名在 fake-ip 模式下仍是域名，代理端可自行解析，避免本地 DNS 泄漏。
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "localhost.ptlogin2.qq.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # 默认走国内 DoH：只有直连域名需要本地解析，CN 域名用国内 DNS 最快。
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  # 防泄漏的核心：境外分类的域名一律用境外 DoH，并强制经由代理组发出。
  # `rule-set:<tag>` 仅支持 behavior=domain 的规则集（见 rule-providers）。
  nameserver-policy:
    "rule-set:cn":
      - "https://dns.alidns.com/dns-query"
      - "https://doh.pub/dns-query"
    "rule-set:private":
      - "https://dns.alidns.com/dns-query"
      - "https://doh.pub/dns-query"
    "rule-set:ai-openai":
      - "https://1.1.1.1/dns-query#🚀 节点选择"
    "rule-set:ai-anthropic":
      - "https://1.1.1.1/dns-query#🚀 节点选择"
    "rule-set:ai-gemini":
      - "https://1.1.1.1/dns-query#🚀 节点选择"
    "rule-set:ai-copilot":
      - "https://1.1.1.1/dns-query#🚀 节点选择"
    "rule-set:ai-perplexity":
      - "https://1.1.1.1/dns-query#🚀 节点选择"
    "rule-set:ai-others":
      - "https://1.1.1.1/dns-query#🚀 节点选择"

proxy-providers:
  airport:
    type: http
    # TODO: 换成你的机场订阅地址（支持 Clash/mihomo 格式订阅）。
    url: "https://sub.example.com/api/v1/client/subscribe?token=YOUR_TOKEN"
    interval: 86400
    path: ./providers/airport.yaml
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      lazy: false

proxy-groups:
  - name: "🚀 节点选择"
    type: select
    use:
      - airport
    proxies:
      - "♻️ 自动选择"
      - "🎯 全球直连"
  - name: "♻️ 自动选择"
    type: url-test
    use:
      - airport
    exclude-filter: '(?i)(中国|大陆|\bcn\b|china)'
    url: https://www.gstatic.com/generate_204
    interval: 300
  - name: "🏠 回国"
    type: select
    use:
      - airport
    proxies:
      - "🚀 节点选择"
    filter: '(?i)(回国|中国|大陆|\bcn\b|china|cn2|上海|北京|广州|深圳|杭州|成都|南京|武汉)'
  - name: "🤖 AI 服务"
    type: select
    use:
      - airport
    proxies:
      - "🎯 全球直连"
      - "♻️ AI 自动选择"
    exclude-filter: '(?i)(香港|港|\bhk\b|hong ?kong|澳门|\bmo\b|macau|中国|大陆|\bcn\b|china|伊朗|\bir\b|朝鲜|\bkp\b|叙利亚|\bsy\b|古巴|\bcu\b|俄罗斯|\bru\b)'
  - name: "♻️ AI 自动选择"
    type: url-test
    use:
      - airport
    filter: '(?i)(美国|\bus\b|united states|日本|\bjp\b|japan|新加坡|\bsg\b|singapore|台湾|\btw\b|taiwan|韩国|\bkr\b|korea|英国|\buk\b|united kingdom|德国|\bde\b|germany|荷兰|\bnl\b|netherlands|加拿大|\bca\b|canada|澳大利亚|\bau\b|australia|法国|\bfr\b|france)'
    exclude-filter: '(?i)(香港|港|\bhk\b|hong ?kong|澳门|\bmo\b|macau|中国|大陆|\bcn\b|china|俄罗斯|\bru\b)'
    url: https://www.gstatic.com/generate_204
    interval: 300
  - name: "🎯 全球直连"
    type: select
    proxies:
      - "DIRECT"
  - name: "🛑 广告拦截"
    type: select
    proxies:
      - "REJECT"
  - name: "🐟 漏网之鱼"
    type: select
    proxies:
      - "🎯 全球直连"
      - "🚀 节点选择"

rules:
  - RULE-SET,private,🎯 全球直连
  - RULE-SET,private-ip,🎯 全球直连
  - RULE-SET,ai-openai,🤖 AI 服务
  - RULE-SET,ai-anthropic,🤖 AI 服务
  - RULE-SET,ai-gemini,🤖 AI 服务
  - RULE-SET,ai-copilot,🤖 AI 服务
  - RULE-SET,ai-perplexity,🤖 AI 服务
  - RULE-SET,ai-others,🤖 AI 服务
  - RULE-SET,cn-region-locked,🏠 回国
  - RULE-SET,cn,🎯 全球直连
  - RULE-SET,cn-ip,🎯 全球直连,no-resolve
  - RULE-SET,cn-ip6,🎯 全球直连,no-resolve
  - MATCH,🐟 漏网之鱼

rule-providers:
  private:
    type: http
    behavior: domain
    format: mrs
    url: "https://cdn.jsdelivr.net/gh/zoran-sid/RouteMint-Rules@release/rules/private/private.mrs"
    path: "./rules/private.mrs"
    interval: 86400
  private-ip:
    type: http
    behavior: ipcidr
    format: mrs
    url: "https://cdn.jsdelivr.net/gh/zoran-sid/RouteMint-Rules@release/rules/private/private-ip.mrs"
