# RouteMint-Rules · 海外华人回国 · ads-strict
# 由 builder 自动生成，请勿手工编辑。
#
# 节点：Loon 支持在配置里声明订阅（[Remote Proxy]），把 Airport 那一行换成你的订阅地址即可。
# 规则：远程规则放在 [Remote Rule]，本地只保留 FINAL。
# 文档：https://nsloon.app/docs/Node/subscription

[General]
ipv6 = false
dns-server = system
proxy-test-url = http://www.gstatic.com/generate_204

[Remote Proxy]
Airport = https://sub.example.com/api/v1/client/subscribe?token=YOUR_TOKEN&flag=loon

[Remote Filter]
f-cn-return = NameRegex,Airport,FilterKey = (?i)(回国|中国|大陆|china|上海|北京|广州|深圳|杭州|成都|南京|武汉|🇨🇳)|(?:^|[^a-z])cn(?:[013-9][0-9]*|[^a-z0-9]|$)

[Proxy Group]
🚀 节点选择 = select, ♻️ 自动选择, 🎯 全球直连, Airport
♻️ 自动选择 = url-test, Airport, url=https://www.gstatic.com/generate_204, interval=300
🏠 回国 = select, REJECT, f-cn-return
🤖 AI 服务 = select, 🎯 全球直连, ♻️ AI 自动选择, 🚀 节点选择, Airport
♻️ AI 自动选择 = url-test, Airport, url=https://www.gstatic.com/generate_204, interval=300
🎯 全球直连 = select, DIRECT
🛑 广告拦截 = select, REJECT
🐟 漏网之鱼 = select, 🎯 全球直连, 🚀 节点选择

