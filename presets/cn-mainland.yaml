id: cn-mainland
label: 身在中国大陆
tagline: 国内直连、境外代理、AI 走专用组
audience: 常驻中国大陆，需要稳定访问境外服务与 AI
summary: 国内域名与 IP 直连；境外服务走代理；AI 与流媒体各自成组；广告拦截默认轻度；无法判断的流量优先走代理。
order: 10
ads: ads-light
notes: |
  AI 组为什么要排除节点：OpenAI/Anthropic/Gemini 会按出口 IP 判断地区，
  香港、澳门、中国大陆节点会被拒绝或触发风控，所以 AI 组必须先按节点名
  过滤掉这些地区，再在剩余节点里选延迟最低的。
  「漏网之鱼」成员顺序是 节点选择 → 直连，即未命中任何分类的域名优先走代理。

groups:
  - name: "🚀 节点选择"
    tag: proxy
    type: select
    use_providers: true
    members:
      - "♻️ 自动选择"
      - "🎯 全球直连"

  - name: "♻️ 自动选择"
    tag: auto
    type: url-test
    use_providers: true
    exclude_filter: "(?i)(?:^|[^a-z])(?:香港|港|hong ?kong|hk|澳门|macau|macao|mo|中国|大陆|cn|china|上海|北京|广州|深圳|杭州|成都|南京|武汉|回国|🇭🇰|🇲🇴|🇨🇳)(?:[^a-z]|$)"
    interval: 300

  - name: "🤖 AI 服务"
    tag: ai
    type: select
    use_providers: true
    members:
      - "♻️ AI 自动选择"
      - "🚀 节点选择"
      - "🎯 全球直连"
    exclude_filter: "(?i)(?:^|[^a-z])(?:香港|港|hong ?kong|hk|澳门|macau|macao|mo|中国|大陆|cn|china|伊朗|iran|ir|朝鲜|kp|叙利亚|sy|古巴|cu|俄罗斯|russia|moscow|ru|上海|北京|广州|深圳|杭州|成都|南京|武汉|回国|🇭🇰|🇲🇴|🇨🇳|🇮🇷|🇰🇵|🇸🇾|🇨🇺|🇷🇺)(?:[^a-z]|$)"

