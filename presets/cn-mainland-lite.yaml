id: cn-mainland-lite
label: 大陆 · 极简
tagline: 同一套逻辑，只留核心分类
audience: 中国大陆用户，老设备或在意内存、耗电、启动速度
summary: 不拆流媒体，不区分具体服务：只保留局域网、广告、AI、国内域名、国内 IP，其余全部交给节点选择。规则条数约为标准版的一半。
order: 40
ads: ads-light
notes: |
  精简的做法是「能靠 FINAL 兜住的分类型就不下发」：
  流媒体、开发者、游戏、大厂、其余境外服务全部交给「漏网之鱼」（节点选择），
  省掉两万多条规则和十几个策略组。AI 单独留一组是因为它需要排除地区节点，
  FINAL 做不到这件事。
  还嫌大就把 ads 改成 ads-off（约省 2.9 万条）。

groups:
  - name: "🚀 节点选择"
    tag: proxy
    type: select
    use_providers: true
    members:
      - "♻️ 自动选择"
      - "🎯 全球直连"

  - name: "♻️ 自动选择"
    tag: auto
    type: url-test
    use_providers: true
    exclude_filter: "(?i)(香港|港|\\bhk\\b|hong ?kong|澳门|\\bmo\\b|macau|中国|大陆|\\bcn\\b|china)"
    interval: 300

  - name: "🤖 AI 服务"
    tag: ai
    type: select
    use_providers: true
    members:
      - "♻️ AI 自动选择"
      - "🎯 全球直连"
    exclude_filter: "(?i)(香港|港|\\bhk\\b|hong ?kong|澳门|\\bmo\\b|macau|中国|大陆|\\bcn\\b|china|俄罗斯|\\bru\\b)"

  - name: "♻️ AI 自动选择"
    tag: ai-auto
    type: url-test
    use_providers: true
    filter: "(?i)(美国|\\bus\\b|united states|日本|\\bjp\\b|japan|新加坡|\\bsg\\b|singapore|台湾|\\btw\\b|taiwan|韩国|\\bkr\\b|korea|英国|\\buk\\b|united kingdom|德国|\\bde\\b|germany|荷兰|\\bnl\\b|netherlands|加拿大|\\bca\\b|canada|澳大利亚|\\bau\\b|australia|法国|\\bfr\\b|france)"
    exclude_filter: "(?i)(香港|港|\\bhk\\b|hong ?kong|澳门|\\bmo\\b|macau|中国|大陆|\\bcn\\b|china|俄罗斯|\\bru\\b)"
    interval: 300

  - name: "🎯 全球直连"
    tag: direct
    type: select
    members:
      - DIRECT

  - name: "🛑 广告拦截"
    tag: reject
    type: select
    members:
      - REJECT

  - name: "🐟 漏网之鱼"
    tag: final
    type: select
    members:
      - "🚀 节点选择"
      - "🎯 全球直连"

rules:
  - {category: private, policy: "🎯 全球直连"}
  - {category: reject-malware, policy: "🛑 广告拦截"}
  - {category: reject-tracker, policy: "🛑 广告拦截"}
  - {category: reject-ads, policy: "🛑 广告拦截"}
  - {category: ai, policy: "🤖 AI 服务"}
  - {category: cn, policy: "🎯 全球直连"}
  - {category: cn-ip, policy: "🎯 全球直连", no_resolve: true}
  - {final: "🐟 漏网之鱼"}
