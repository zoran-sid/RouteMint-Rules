id: overseas
label: 身在海外
tagline: 默认直连，只把 AI 与部分流媒体交给代理
audience: 常驻海外，Google/YouTube 等本来就能直接访问
summary: 默认全部直连；AI 服务走 AI 专用组（按节点名排除香港/澳门/大陆等地区）；Google、YouTube 直连；TikTok、Netflix、Disney+、Max、Prime Video 走独立策略组；游戏平台商店与社区走代理，游戏下载与百度网盘直连，其余流量直连。
order: 20
ads: ads-light
notes: |
  海外用户访问大多数站点不需要代理，直连更快也更省流量。
  「漏网之鱼」成员顺序是 直连 → 节点选择，即未命中分类的流量默认直连；
  如果你在某些站点上发现代理反而更快，把该站点补进 sources/proxy.yaml 并把它指向代理组即可。

groups:
  - name: "🚀 节点选择"
    tag: proxy
    type: select
    use_providers: true
    members:
      - "♻️ 自动选择"
      - "🎯 全球直连"

  - name: "♻️ 自动选择"
    tag: auto
    type: url-test
    use_providers: true
    exclude_filter: "(?i)(?:^|[^a-z])(?:中国|大陆|cn|china|上海|北京|广州|深圳|杭州|成都|南京|武汉|回国|🇨🇳)(?:[^a-z]|$)"
    interval: 300

  - name: "🤖 AI 服务"
    tag: ai
    type: select
    use_providers: true
    members:
      - "♻️ AI 自动选择"
      - "🚀 节点选择"
      - "🎯 全球直连"
    exclude_filter: "(?i)(?:^|[^a-z])(?:香港|港|hong ?kong|hk|澳门|macau|macao|mo|中国|大陆|cn|china|伊朗|iran|ir|朝鲜|kp|叙利亚|sy|古巴|cu|俄罗斯|russia|moscow|ru|上海|北京|广州|深圳|杭州|成都|南京|武汉|回国|🇭🇰|🇲🇴|🇨🇳|🇮🇷|🇰🇵|🇸🇾|🇨🇺|🇷🇺)(?:[^a-z]|$)"

  - name: "♻️ AI 自动选择"
    tag: ai-auto
    type: url-test
    use_providers: true
    exclude_filter: "(?i)(?:^|[^a-z])(?:香港|港|hong ?kong|hk|澳门|macau|macao|mo|中国|大陆|cn|china|伊朗|iran|ir|朝鲜|kp|叙利亚|sy|古巴|cu|俄罗斯|russia|moscow|ru|上海|北京|广州|深圳|杭州|成都|南京|武汉|回国|🇭🇰|🇲🇴|🇨🇳|🇮🇷|🇰🇵|🇸🇾|🇨🇺|🇷🇺)(?:[^a-z]|$)"
    interval: 300

  # 手动固定流媒体出口，避免延迟测试自动跨区切换。
  - name: "🌍 流媒体"
    tag: streaming
    type: select
    use_providers: true
    exclude_filter: "(?i)(中国|大陆|回国|🇨🇳)"

  - name: "🎬 Netflix"
    tag: netflix
    type: select
    use_providers: true
    members:
      - "🌍 流媒体"
      - "🎯 全球直连"

  - name: "🎬 Disney+"
    tag: disney
    type: select
    use_providers: true
    members:
      - "🌍 流媒体"
      - "🎯 全球直连"

  - name: "🎬 Max"
    tag: max
    type: select
    use_providers: true
    members:
      - "🌍 流媒体"
      - "🎯 全球直连"

  - name: "🎬 Prime Video"
    tag: primevideo
    type: select
    use_providers: true
    members:
      - "🌍 流媒体"
      - "🎯 全球直连"

  # TikTok 按 IP 地区限定，香港/大陆/澳门节点会直接不可用。
  - name: "🎬 TikTok"
    tag: tiktok
    type: select
    use_providers: true
    members:
      - "♻️ 自动选择"
      - "🎯 全球直连"
    exclude_filter: "(?i)(?:^|[^a-z])(?:香港|港|hong ?kong|hk|澳门|macau|macao|mo|中国|大陆|cn|china|俄罗斯|russia|ru|上海|北京|广州|深圳|杭州|成都|南京|武汉|回国|🇭🇰|🇲🇴|🇨🇳|🇷🇺)(?:[^a-z]|$)"

  - name: "🎯 全球直连"
    tag: direct
    type: select
    members:
      - DIRECT

  - name: "🛑 广告拦截"
    tag: reject
    type: select
    members:
      - REJECT

  - name: "🐟 漏网之鱼"
    tag: final
    type: select
    members:
      - "🎯 全球直连"
      - "🚀 节点选择"

rules:
  - {category: private, policy: "🎯 全球直连"}
  - {category: reject-malware, policy: "🛑 广告拦截"}
  - {category: reject-tracker, policy: "🛑 广告拦截"}
  - {category: reject-ads, policy: "🛑 广告拦截"}
  - {category: ai-openai, policy: "🤖 AI 服务"}
  - {category: ai-anthropic, policy: "🤖 AI 服务"}
  - {category: ai-gemini, policy: "🤖 AI 服务"}
  - {category: ai-copilot, policy: "🤖 AI 服务"}
  - {category: ai-perplexity, policy: "🤖 AI 服务"}
  - {category: ai-others, policy: "🤖 AI 服务"}
  - {category: netflix, policy: "🎬 Netflix"}
  - {category: disney, policy: "🎬 Disney+"}
  - {category: youtube, policy: "🎯 全球直连"}
  - {category: tiktok, policy: "🎬 TikTok"}
  - {category: max, policy: "🎬 Max"}
  - {category: primevideo, policy: "🎬 Prime Video"}
  - {category: game-download, policy: "🎯 全球直连"}
  - {category: baidu-pan, policy: "🎯 全球直连"}
  - {category: game-platform, policy: "🚀 节点选择"}
  - {category: steam-direct, policy: "🎯 全球直连", no_resolve: true}
  - {category: google, policy: "🎯 全球直连"}
  - {category: cn, policy: "🎯 全球直连"}
  - {category: cn-ip, policy: "🎯 全球直连", no_resolve: true}
  - {category: cn-ip6, policy: "🎯 全球直连", no_resolve: true}
  - {final: "🐟 漏网之鱼"}
