# 上游声明。每一项都必须写清楚许可证与失败策略：
# 构建时若拉取失败，会沿用 .cache/upstreams 里上一次成功的快照，绝不产出空文件。
version: 1

defaults:
  timeout_seconds: 30
  retries: 2
  cache_ttl_hours: 12

upstreams:
  v2fly-dlc:
    title: v2fly domain-list-community
    format: v2fly-dat
    # 直接消费官方编译产物 dlc.dat（2.4 MB，一次请求拿到全部 1556 个分类），
    # 避免逐个 data/ 文件递归 include 造成上千次请求。
    url: https://github.com/v2fly/domain-list-community/releases/latest/download/dlc.dat
    ref: latest
    license: MIT
    license_url: https://github.com/v2fly/domain-list-community/blob/master/LICENSE
    homepage: https://github.com/v2fly/domain-list-community
    # 每个分类是 data/ 下的独立文件；include: 会被递归展开（带缓存与环检测）。
    notes: 每日构建；格式见 https://github.com/v2fly/domain-list-community（dlc.dat / GeoSiteList）
    on_failure: snapshot

  china-operator-ip:
    title: gaoyifan/china-operator-ip
    format: cidr
    url_template: https://raw.githubusercontent.com/gaoyifan/china-operator-ip/{ref}/{category}
    ref: ip-lists
    license: MIT
    license_url: https://github.com/gaoyifan/china-operator-ip/blob/ip-lists/LICENSE
    homepage: https://github.com/gaoyifan/china-operator-ip
    # 由 BGP/ASN 生成，比 APNIC 注册数据更贴近实际路由；IPv4/IPv6 分文件。
    notes: 每日更新；china46.txt 同时含 v4/v6。
    on_failure: snapshot

  shadowwhisperer:
    title: ShadowWhisperer/BlockLists
    format: domains
    url_template: https://raw.githubusercontent.com/ShadowWhisperer/BlockLists/{ref}/Lists/{category}
    ref: master
    license: Unlicense
    license_url: https://github.com/ShadowWhisperer/BlockLists/blob/master/LICENSE
    homepage: https://github.com/ShadowWhisperer/BlockLists
    # 选它而不是 AdGuard/EasyList：后者是 GPL-3.0 或 CC-BY-SA，与本仓库 MIT 不兼容。
    notes: 每日更新；Ads/Marketing/Tracking/Malware 按用途拆开。
    on_failure: snapshot

  urlhaus:
    title: malware-filter/urlhaus-filter（GitLab）
    format: domains
    url: https://malware-filter.gitlab.io/malware-filter/urlhaus-filter-domains.txt
    license: CC0-1.0
    license_url: https://gitlab.com/malware-filter/urlhaus-filter/-/blob/main/LICENSE-CC0.md
    homepage: https://gitlab.com/malware-filter/urlhaus-filter
    notes: 数据 CC0；每 12 小时更新，域名轮换快，因此该分类不参与「条数突变保护」。
    on_failure: snapshot
